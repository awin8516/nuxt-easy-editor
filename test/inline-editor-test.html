<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>内联编辑器测试页面</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      line-height: 1.6;
      color: #333;
      max-width: 800px;
      margin: 0 auto;
      padding: 20px;
    }
    .container {
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 20px;
    }
    h1, h2 {
      color: #1f2937;
    }
    .editable-section {
      padding: 15px;
      border: 1px dashed #9ca3af;
      border-radius: 6px;
      margin: 15px 0;
      cursor: pointer;
    }
    .editable-section:hover {
      background-color: #f9fafb;
    }
    pre {
      background-color: #f3f4f6;
      padding: 15px;
      border-radius: 6px;
      overflow-x: auto;
    }
    button {
      background-color: #3b82f6;
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
    }
    button:hover {
      background-color: #2563eb;
    }
  </style>
</head>
<body>
  <h1>内联编辑器测试页面</h1>
  
  <div class="container">
    <h2>测试区域</h2>
    
    <p class="editable-section" data-editable="true">
      这是一个可编辑的段落。点击编辑按钮后，您应该能够直接在此处编辑文本内容，而不是在一个新的textarea中编辑。
    </p>
    
    <div class="editable-section" data-editable="true">
      <h3>可编辑的标题</h3>
      <p>这是一个包含多个元素的可编辑区域。您可以编辑标题和段落内容。</p>
    </div>
    
    <ul class="editable-section" data-editable="true">
      <li>可编辑列表项 1</li>
      <li>可编辑列表项 2</li>
      <li>可编辑列表项 3</li>
    </ul>
  </div>
  
  <div class="container">
    <h2>使用说明</h2>
    <ol>
      <li>选择上方的任意可编辑区域</li>
      <li>点击下方的「编辑选中元素」按钮</li>
      <li>观察元素是否变为内联编辑模式（带有蓝色边框）</li>
      <li>尝试编辑内容，然后使用工具栏保存或取消</li>
      <li>也可以按 ESC 键取消编辑</li>
    </ol>
    
    <button id="edit-btn">编辑选中元素</button>
  </div>
  
  <script>
    // 模拟visual-editor.js中的功能
    let selectedElement = null;
    
    // 选择元素功能
    document.querySelectorAll('.editable-section').forEach(section => {
      section.addEventListener('click', (e) => {
        e.preventDefault();
        
        // 移除之前的选中状态
        if (selectedElement) {
          selectedElement.style.outline = 'none';
        }
        
        // 设置新的选中元素
        selectedElement = section;
        selectedElement.style.outline = '2px solid #3b82f6';
      });
    });
    
    // 模拟导入和编辑功能
    document.getElementById('edit-btn').addEventListener('click', async () => {
      if (!selectedElement) {
        alert('请先选择一个可编辑区域');
        return;
      }
      
      // 动态导入visual-editor-content模块
      try {
        // 由于这是测试页面，我们将直接使用模拟的startEditContent函数
        // 在实际环境中，这里应该导入真实的模块
        
        // 模拟startEditContent函数
        const startEditContent = (element, sourceFiles) => {
          // 保存原始内容，用于取消操作
          const originalContent = element.innerHTML;
          
          // 保存原始样式，用于恢复
          const originalStyle = element.style.cssText;
          
          // 创建编辑工具栏
          const editToolbar = document.createElement('div');
          editToolbar.className = 'content-edit-toolbar';
          editToolbar.innerHTML = `
            <button class="content-edit-save">保存</button>
            <button class="content-edit-cancel">取消</button>
          `;
          
          // 添加工具栏到DOM
          document.body.appendChild(editToolbar);
          
          // 设置工具栏位置
          const rect = element.getBoundingClientRect();
          editToolbar.style.left = `${rect.right + 10}px`;
          editToolbar.style.top = `${rect.top}px`;
          
          // 设置元素为可编辑
          element.setAttribute('contenteditable', 'true');
          element.classList.add('content-editable-active');
          
          // 获取按钮
          const saveBtn = editToolbar.querySelector('.content-edit-save');
          const cancelBtn = editToolbar.querySelector('.content-edit-cancel');
          
          // 保存按钮事件
          saveBtn.addEventListener('click', () => {
            console.log('保存内容:', element.innerHTML);
            // 恢复元素状态
            element.removeAttribute('contenteditable');
            element.classList.remove('content-editable-active');
            element.style.cssText = originalStyle;
            // 移除工具栏
            editToolbar.remove();
            alert('内容已保存！');
          });
          
          // 取消按钮事件
          cancelBtn.addEventListener('click', () => {
            // 恢复原始内容
            element.innerHTML = originalContent;
            // 恢复元素状态
            element.removeAttribute('contenteditable');
            element.classList.remove('content-editable-active');
            element.style.cssText = originalStyle;
            // 移除工具栏
            editToolbar.remove();
          });
          
          // ESC键取消
          element.addEventListener('keydown', function handler(e) {
            if (e.key === 'Escape') {
              // 恢复原始内容
              element.innerHTML = originalContent;
              // 恢复元素状态
              element.removeAttribute('contenteditable');
              element.classList.remove('content-editable-active');
              element.style.cssText = originalStyle;
              // 移除工具栏
              editToolbar.remove();
              // 移除事件监听
              element.removeEventListener('keydown', handler);
            }
          });
          
          // 聚焦元素
          element.focus();
        };
        
        // 调用模拟函数
        startEditContent(selectedElement, ['dummy-file.vue']);
        
      } catch (error) {
        console.error('加载编辑器失败:', error);
        alert('编辑器加载失败');
      }
    });
    
    // 加载CSS样式
    const link = document.createElement('link');
    link.rel = 'stylesheet';
    link.href = '../runtime/css/visual-editor.css';
    document.head.appendChild(link);
  </script>
</body>
</html>
